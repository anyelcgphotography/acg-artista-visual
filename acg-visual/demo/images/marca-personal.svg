			<stop offset="0" stop-color="#151210"/>
			<stop offset=".55" stop-color="#3a2b20"/>
			<stop offset="1" stop-color="#9a6a3c"/>
		</linearGradient>
		<radialGradient id="sol-marca-personal" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#ffddb4" stop-opacity=".95"/>
