<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
	<defs>
		<linearGradient id="cielo-servicio-marca" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#141210"/>
			<stop offset=".55" stop-color="#332a22"/>
			<stop offset="1" stop-color="#8d6c48"/>
		</linearGradient>
		<radialGradient id="sol-servicio-marca" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#ffe6c2" stop-opacity=".95"/>
			<stop offset="1" stop-color="#ffe6c2" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="velo-servicio-marca" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#000" stop-opacity=".45"/>
			<stop offset=".45" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity=".5"/>
		</linearGradient>
		<filter id="grano-servicio-marca">
			<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
			<feColorMatrix type="saturate" values="0"/>
		</filter>
	</defs>

	<rect width="1200" height="900" fill="url(#cielo-servicio-marca)"/>
	<circle cx="816.0" cy="306.0" r="436.8" fill="url(#sol-servicio-marca)"/>
	<circle cx="816.0" cy="306.0" r="70.6" fill="#ffe6c2" opacity=".85"/>
	
	
	<rect y="738.0" width="1200" height="162.0" fill="#0b0a09"/>
	<g fill="#050505">
				<circle cx="504.0" cy="447.4" r="96.9"/>
				<path d="M310.2 900
					C319.9 553.9
					 416.8 517.1
					 504.0 517.1
					C591.2 517.1
					 688.1 553.9
					 697.8 900 Z"/>
			</g>
	<rect width="1200" height="900" fill="url(#velo-servicio-marca)"/>
	<rect width="1200" height="900" filter="url(#grano-servicio-marca)" opacity=".05"/>
</svg>
