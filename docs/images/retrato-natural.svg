<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
	<defs>
		<linearGradient id="cielo-retrato-natural" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#101512"/>
			<stop offset=".55" stop-color="#22392c"/>
			<stop offset="1" stop-color="#5f8a5c"/>
		</linearGradient>
		<radialGradient id="sol-retrato-natural" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#e8ffcf" stop-opacity=".95"/>
			<stop offset="1" stop-color="#e8ffcf" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="velo-retrato-natural" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#000" stop-opacity=".45"/>
			<stop offset=".45" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity=".5"/>
		</linearGradient>
		<filter id="grano-retrato-natural">
			<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
			<feColorMatrix type="saturate" values="0"/>
