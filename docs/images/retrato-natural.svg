	<rect width="1000" height="1250" fill="url(#cielo-retrato-natural)"/>
	<circle cx="660.0" cy="375.0" r="312.0" fill="url(#sol-retrato-natural)"/>
	<circle cx="660.0" cy="375.0" r="50.4" fill="#e8ffcf" opacity=".85"/>
	
	
	<rect y="1025.0" width="1000" height="225.0" fill="#0a0d0b"/>
	<g fill="#050505">
				<circle cx="460.0" cy="598.9" r="142.0"/>
				<path d="M175.9 1250
					C190.2 755.2
					 332.2 701.2
					 460.0 701.2
